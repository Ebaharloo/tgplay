<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E6ECFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#0B1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="36" y="36" width="440" height="440" rx="114" fill="url(#tile)"/>
  <rect x="36" y="36" width="440" height="440" rx="114" fill="url(#glow)"/>
  <rect x="36" y="36" width="440" height="440" rx="114" fill="url(#vig)"/>

  <!-- stream ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff"
          stroke-opacity="0.20" stroke-width="9"/>

  <!-- rounded play triangle -->
  <polygon points="216,166 216,346 382,256" fill="url(#tri)"
           stroke="url(#tri)" stroke-width="28" stroke-linejoin="round"/>

  <!-- sparkle -->
  <path d="M382 122 l7.5 19 19 7.5 -19 7.5 -7.5 19 -7.5-19 -19-7.5 19-7.5 z"
        fill="#ffffff" opacity="0.92"/>
</svg>
